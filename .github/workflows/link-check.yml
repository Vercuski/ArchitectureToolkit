name: Link Check

# Runs on every push, plus a manual trigger so you can re-run it on demand
# (e.g. after fixing a link) without needing a new commit.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache lychee's results so repeat runs against unchanged external URLs
      # don't re-hit the network every push (also helps avoid rate limits).
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --cache --max-cache-age 1d --no-progress .
          format: markdown
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}