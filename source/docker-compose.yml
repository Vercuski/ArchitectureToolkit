# ArchitectureToolkit — base stack (ADR-0008, ADR-0010, ADR-0011, ADR-0012)
#
# Default: two services, plain HTTP, db not reachable from the host.
# Bring your own reverse proxy/tunnel for TLS (ADR-0010), or opt in to
# the bundled Caddy proxy:
#   docker compose -f docker-compose.yml -f docker-compose.with-proxy.yml up
#
# For direct DB tool access (DBeaver, pgAdmin, etc.), opt in separately:
#   docker compose -f docker-compose.yml -f docker-compose.expose-db.yml up
#
# First run: the api container comes up in Setup Mode (no ConnectionStrings/
# Authentication/Smtp/TemplateLibrary env vars are passed to it at all
# anymore — see the "Removing appsettings.json secrets" ADR). Open
# http://localhost:8080 and complete the setup wizard, but change two of
# its defaults first — they default to what a bare `dotnet run` needs,
# not this Compose stack:
#   - connection strings: Host=localhost -> Host=db (matching
#     POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD from .env)
#   - template library root path: ../DocumentationTemplates ->
#     /app/DocumentationTemplates (where the Dockerfile bakes it in)
# Saving triggers the api container to restart itself; `restart:
# unless-stopped` below brings it back up already configured, migrated,
# and seeded.

services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
       POSTGRES_DB: ${POSTGRES_DB:?error}
       POSTGRES_USER: ${POSTGRES_USER:?error}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
    expose:
      - "5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Kestrel serves HTTP only in every Compose context — TLS, if any,
      # is always terminated externally (ADR-0010). This is independent
      # of launchSettings.json's "Container (Dockerfile)" profile, which
      # only applies to `dotnet run`/VS debugging, never to this image.
      ASPNETCORE_HTTP_PORTS: 8080

      # Everything this app used to need as ConnectionStrings__*/
      # DatabasePlatform__*/TemplateLibrary__*/Authentication__*/Smtp__*
      # environment variables is now entered once, through the setup
      # wizard on first run, and persisted encrypted inside the
      # app-config volume below — see ProtectedFileAppConfigurationStore.
      # This is the only setting the container itself still needs: where
      # that volume is mounted. Not a secret, just a path.
      Setup__StorageDirectory: /app/config

      # Where uploaded document attachments (the ToastUI "attach file"
      # toolbar button) are stored — a path, not a secret, same reasoning
      # as Setup__StorageDirectory itself, so it stays a plain env var
      # rather than going through the setup wizard.
      Attachments__RootPath: /app/attachments
    volumes:
      # Persists the setup wizard's encrypted configuration, its Data
      # Protection key ring, and the self-hosted OpenIddict
      # signing/encryption certificates (PersistedCertificateProvisioner)
      # across restarts/redeploys — consolidating what used to be a
      # separate "identity-keys" volume/AUTH_KEYS_PASSWORD secret into
      # this one, now auto-generated (see PersistedAppConfiguration.AuthKeysPassword).
      - app-config:/app/config
      # Uploaded document attachments' actual bytes — separate from
      # app-config above since this holds arbitrary, potentially large
      # user content rather than small encrypted secrets, and the two
      # have unrelated backup/retention concerns.
      - document-attachments:/app/attachments
    ports:
      - ${ASPNETCORE_HTTP_PORTS}:8080
    healthcheck:
      # /health reports a real signal — DatabaseHealthCheck actually
      # probes PostgreSQL connectivity via CommandDbContext, replacing
      # the placeholder that used to live here and returned a random
      # status on every call. Healthy also covers Setup Mode: nothing
      # registers DatabaseHealthCheck until isConfigured is true (see
      # Program.cs), so an unconfigured-but-running instance reports
      # Healthy with zero checks rather than failing one it can't run
      # yet. start_period is generous because a fresh container runs EF
      # Core migrations (ADR-0015) and template-library seeding
      # (ADR-0014) before it can serve anything.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROOT_VOLUME_DIR:?error}/docker/volumes/Databases/PostgreSQL/Data
  app-config:
  document-attachments:
